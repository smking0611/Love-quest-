name: Validate prototype

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML structure and extract inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          from collections import Counter

          source = Path("index.html").read_text(encoding="utf-8")

          class StructureCheck(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if "id" in values:
                      self.ids.append(values["id"])

          parser = StructureCheck()
          parser.feed(source)
          parser.close()

          duplicates = sorted(key for key, count in Counter(parser.ids).items() if count > 1)
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          if source.lower().count("<html") != 1 or "</html>" not in source.lower():
              raise SystemExit("Missing or duplicated HTML root structure")
          if source.lower().count("<script") != source.lower().count("</script>"):
              raise SystemExit("Unbalanced script tags")
          scripts = re.findall(r"<script\\b[^>]*>(.*?)</script\\s*>", source, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/inline-script.js").write_text("\\n".join(scripts), encoding="utf-8")
          print(f"HTML parsed; {len(parser.ids)} IDs found; inline script extracted.")
          PY

      - name: Check JavaScript syntax
        run: node --check /tmp/inline-script.js
